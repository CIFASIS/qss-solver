name: C/C++ CI

on:
  push:
  pull_request:
    branches: [ qss-solver-dev ]

env:
  MMOC_PATH: $GITHUB_WORKSPACE
  MMOC_SRC: $GITHUB_WORKSPACE/src
  MMOC_DOC: $GITHUB_WORKSPACE/doc
  MMOC_LIBS: $GITHUB_WORKSPACE/lib
  MMOC_BUILD: $GITHUB_WORKSPACE/build
  MMOC_MODELS: $GITHUB_WORKSPACE/models
  MMOC_OUTPUT: $GITHUB_WORKSPACE/output
  MMOC_BIN: $GITHUB_WORKSPACE/bin
  MMOC_PACKAGES: $GITHUB_WORKSPACE/packages
  MMOC_LIBRARIES: $GITHUB_WORKSPACE/lib
  MMOC_ENGINE: $GITHUB_WORKSPACE/src/engine
  MMOC_INCLUDE: $GITHUB_WORKSPACE/src/usr/include

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
    - name: Install deps.
      run: | 
        sudo apt-get update
        sudo apt-get install bison++
        sudo apt-get install cmake 
        sudo apt-get install g++
        sudo apt-get install gfortran
        sudo apt-get install gnuplot
        sudo apt-get install libatlas-base-dev
        sudo apt-get install libboost1.83-dev
        sudo apt-get install libcln-dev
        sudo apt-get install libconfig-dev
        sudo apt-get install libginac-dev
        sudo apt-get install libgsl-dev
        sudo apt-get install libsbml5-dev
        sudo apt-get install libscotch-dev
        sudo apt-get install libsuitesparse-dev
        sudo apt-get install pkgconf
        sudo apt-get install python3
        sudo apt-get install qtbase5-dev
        sudo apt-get install qtbase5-dev-tools
        sudo apt-get install rapidjson-dev

    - name: Install local deps.
      working-directory: ./src/mmoc/3rd-party/flex
      run: | 
        sudo apt-get install ./flex-old.deb

    - name: Create build folder.
      working-directory: ./src
      run: |
        mkdir -p build

    - name: Configure
      working-directory: ./src/build
      run: |
        cmake ..

    - name: Build
      working-directory: ./src/build
      run: |
        make

    - name: Install
      working-directory: ./src/build
      run: |
        make install

    - name: Tests
      working-directory: ./src/build
      run: make test
